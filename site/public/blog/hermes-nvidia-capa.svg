<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, Segoe UI, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
  </defs>

  <!-- Eyebrow -->
  <text x="80" y="120" font-size="22" fill="#a1a1aa" font-weight="600" letter-spacing="2">IA GRATUITA · GUIA PRÁTICO</text>

  <!-- Título -->
  <text x="78" y="190" font-size="58" fill="#18181b" font-weight="800">Hermes Agent + NVIDIA NIM</text>
  <text x="80" y="250" font-size="32" fill="#52525b" font-weight="500">Use inteligência artificial de graça e crie seus próprios agentes</text>

  <!-- Fluxo de 3 cards -->
  <g transform="translate(80 330)">
    <!-- Card 1: NVIDIA -->
    <rect x="0" y="0" width="320" height="180" rx="22" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <circle cx="46" cy="50" r="22" fill="#76b900"/>
    <text x="38" y="58" font-size="26" fill="#fff" font-weight="800">N</text>
    <text x="84" y="48" font-size="22" fill="#18181b" font-weight="700">build.nvidia.com</text>
    <text x="84" y="76" font-size="16" fill="#71717a">Chave de API grátis</text>
    <text x="30" y="130" font-size="16" fill="#52525b">100+ modelos · 40 req/min</text>
    <text x="30" y="156" font-size="16" fill="#52525b">sem cartão de crédito</text>

    <!-- seta -->
    <text x="350" y="100" font-size="40" fill="#d4d4d8">→</text>

    <!-- Card 2: Hermes -->
    <rect x="400" y="0" width="320" height="180" rx="22" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
    <rect x="424" y="28" width="44" height="44" rx="12" fill="#CC785C"/>
    <text x="436" y="58" font-size="24">🜲</text>
    <text x="484" y="48" font-size="22" fill="#18181b" font-weight="700">Hermes Agent</text>
    <text x="484" y="76" font-size="16" fill="#71717a">O agente que evolui</text>
    <text x="430" y="130" font-size="16" fill="#52525b">Instala em 1 comando</text>
    <text x="430" y="156" font-size="16" fill="#52525b">aprende com o uso</text>

    <!-- seta -->
    <text x="750" y="100" font-size="40" fill="#d4d4d8">→</text>

    <!-- Card 3: Agentes -->
    <rect x="800" y="0" width="320" height="180" rx="22" fill="#18181b"/>
    <rect x="824" y="28" width="44" height="44" rx="12" fill="#7c3aed"/>
    <text x="836" y="58" font-size="24">✨</text>
    <text x="884" y="48" font-size="22" fill="#fafafa" font-weight="700">Seus Agentes</text>
    <text x="884" y="76" font-size="16" fill="#a1a1aa">Skills sob medida</text>
    <text x="830" y="130" font-size="16" fill="#d4d4d8">SKILL.md simples</text>
    <text x="830" y="156" font-size="16" fill="#d4d4d8">vira /comando</text>
  </g>
</svg>
