<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projeto Terra</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07060c; overflow: hidden; }
    canvas#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: none; }
    .ui { font: 12px/1.5 ui-monospace, Consolas, monospace; color: #e8e2f5; }
    #help {
      position: fixed; right: 12px; bottom: 12px; padding: 10px 14px; max-width: 300px;
      background: rgba(14, 10, 26, 0.72); border: 1px solid #4a3f6b; border-radius: 6px;
      pointer-events: none; user-select: none;
    }
    #help b { color: #f5d76e; font-weight: 600; }
    #help.hidden { display: none; }
    #stats { margin-top: 6px; color: #9b90b8; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 16px; background: #07060c; }
    #chat {
      display: none; position: fixed; left: 12px; bottom: 12px; width: min(420px, 60vw); padding: 6px 8px;
      background: rgba(14, 10, 26, 0.9); border: 1px solid #6a5a9a; border-radius: 4px; color: #fff; outline: none;
    }
    #lobby {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(ellipse at 50% 30%, #2a2250, #07060c 70%);
    }
    #lobby .card {
      display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
      padding: 22px 24px; max-width: 640px; width: 100%; box-sizing: border-box;
      background: rgba(18, 14, 34, 0.92); border: 1px solid #4a3f6b; border-radius: 10px;
    }
    #lobby h1 { grid-column: 1 / -1; margin: 0; font-size: 26px; letter-spacing: 4px; color: #f5d76e; text-shadow: 3px 3px 0 #3a2a10; }
    #lpreview { width: 204px; height: 300px; image-rendering: pixelated; background: linear-gradient(#3a5a9a, #7fb0e0 90%); border-radius: 6px; }
    #lobby label { display: block; margin: 8px 0 4px; color: #b8b0d0; }
    #lname { width: 100%; box-sizing: border-box; padding: 7px 9px; font: inherit; color: #fff; background: #0e0a1c; border: 1px solid #5d5480; border-radius: 4px; }
    .row { display: flex; flex-wrap: wrap; gap: 5px; }
    .sw { width: 22px; height: 22px; border: 2px solid #1a1428; border-radius: 4px; cursor: pointer; padding: 0; }
    .sw.on { border-color: #f5d76e; transform: translateY(-2px); }
    .opt { font: inherit; padding: 4px 9px; color: #e8e2f5; background: #231c3c; border: 1px solid #5d5480; border-radius: 4px; cursor: pointer; }
    .opt.on { border-color: #f5d76e; color: #f5d76e; }
    #lplay {
      margin-top: 14px; width: 100%; padding: 10px; font: 700 15px ui-monospace, Consolas, monospace; letter-spacing: 2px;
      color: #1a1020; background: #f5d76e; border: 0; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0 #a88a2a;
    }
    #lplay:active { transform: translateY(3px); box-shadow: 0 1px 0 #a88a2a; }
    #lstatus { grid-column: 1 / -1; color: #9b90b8; font-size: 11px; }
    #lstatus b { color: #b8f0a0; font-weight: 600; }
    @media (max-width: 560px) { #lobby .card { grid-template-columns: 1fr; justify-items: center; } #lobby .form { width: 100%; } }
  </style>
</head>
<body class="ui">
  <canvas id="game"></canvas>
  <div id="help">
    <div><b>A / D</b> mover · <b>Espaço</b> pular</div>
    <div><b>Botão esq.</b> usar item (minerar, atacar, atirar, colocar)</div>
    <div><b>1–0 / roda</b> hotbar · <b>E</b> inventário e criação</div>
    <div><b>Enter</b> chat · <b>L</b> luz suave × retrô · <b>T</b> acelerar tempo</div>
    <div><b>Shift+clique</b> equipa armadura / move itens · <b>H</b> esconder</div>
    <div id="stats"></div>
  </div>
  <input id="chat" class="ui" maxlength="120" placeholder="Mensagem… (Enter envia, Esc cancela)" autocomplete="off" />
  <div id="lobby">
    <div class="card">
      <h1>PROJETO TERRA</h1>
      <canvas id="lpreview" width="68" height="100"></canvas>
      <div class="form">
        <label for="lname">Nome</label>
        <input id="lname" maxlength="16" autocomplete="off" />
        <label>Cabelo</label><div class="row" id="lhair"></div>
        <label>Estilo</label><div class="row" id="lstyle"></div>
        <label>Roupa</label><div class="row" id="lshirt"></div>
        <label>Pele</label><div class="row" id="lskin"></div>
        <button id="lplay">JOGAR</button>
      </div>
      <div id="lstatus">Verificando servidor…</div>
    </div>
  </div>
  <div id="loading">Carregando…</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
